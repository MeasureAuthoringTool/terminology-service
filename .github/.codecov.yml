coverage:
  status:
    project:
      default:   # default is the status check's name, not default settings
        target: 90%
        threshold: 5%
        base: auto
        paths:
          - "src"
    patch:
      default:
        target: 95%
        threshold: 10%
        base: auto
        paths:
          - "src"
exclude:
  - "src/main/java/generated.vsac.nlm.nih.gov/**"
